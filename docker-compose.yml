# Las contraseñas se leen de scripts/.respaldo.env (no se suben al repositorio):
#   docker compose --env-file scripts/.respaldo.env up -d --build
services:
  # Aplicación PHP (opcional)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citas_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    networks:
      - bbdd_network
    depends_on:
      - db

  # Base de datos MariaDB
  db:
    image: mariadb:10.8
    container_name: citas_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:?Defina DB_PASS en scripts/.respaldo.env}
      MYSQL_DATABASE: proyecto_citas
      TZ: America/Bogota
    command:
      - --event-scheduler=ON
      - --log-bin-trust-function-creators=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bbdd_network

  # phpMyAdmin (opcional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: citas_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    networks:
      - bbdd_network
    depends_on:
      - db

volumes:
  db_data:

networks:
  bbdd_network:
    driver: bridge
